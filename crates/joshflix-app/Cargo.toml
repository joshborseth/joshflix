[package]
name = "joshflix-app"
description = "Joshflix: a native Rust TV app (Slint + libmpv) for Comet and Real-Debrid"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "joshflix_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "joshflix"
path = "src/main.rs"

[dependencies]
joshflix-core.workspace = true
joshflix-player.workspace = true
joshflix-protocol.workspace = true
slint = { workspace = true, features = ["std", "compat-1-2", "renderer-femtovg"] }
tokio.workspace = true
tracing.workspace = true
qrcode.workspace = true
base64.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { workspace = true, features = ["backend-winit"] }
tracing-subscriber.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# Our own platform (src/android_platform.rs) instead of Slint's Skia-based backend.
i-slint-renderer-femtovg = { version = "=1.18.1", features = ["opengl"] }
android-activity = { version = "0.6.1", features = ["native-activity"] }
ndk = { version = "0.9", default-features = false }
glutin = { version = "0.32", default-features = false, features = ["egl"] }
raw-window-handle = "0.6"
tracing = { workspace = true, features = ["log"] }
log = "0.4"
android_logger = "0.15.1"
jni = "0.21"
libloading.workspace = true
libc = "0.2"

[build-dependencies]
slint-build.workspace = true
