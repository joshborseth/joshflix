[package]
name = "joshflix-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Private LAN relay for Joshflix: Real-Debrid key pairing and app updates."

[dependencies]
joshflix-protocol.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
rand.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64 = "0.23.1"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.6.11", default-features = false, features = ["fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["signal"] }
