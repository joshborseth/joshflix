[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
rust-version = "1.90"

[workspace.dependencies]
joshflix-protocol = { path = "crates/joshflix-protocol" }
joshflix-core = { path = "crates/joshflix-core" }
joshflix-player = { path = "crates/joshflix-player" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "gzip", "http2", "form", "stream"] }
# TLS: ring provider + Mozilla roots, so Android needs no Java platform verifier.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.12"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2.5.8"
sha2 = "0.11.1"
rand = "0.10.3"
redb = "4.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = { version = "0.14.1", default-features = false }
libloading = "0.9.0"
axum = "0.8.9"
slint = { version = "1.18.1", default-features = false }
slint-build = "1.18.1"

[profile.dev]
debug = "line-tables-only"
# The dev box disk is small and shared; incremental caches grow by gigabytes.
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
